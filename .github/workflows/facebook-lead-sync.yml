name: Facebook Lead Sync

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Sync Facebook leads into CRM
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://eduquantica-crm.vercel.app/api/cron/facebook-sync")
          cat /tmp/resp.json
          if [ "$STATUS" != "200" ]; then
            echo "Sync failed with HTTP $STATUS"
            exit 1
          fi
          CREATED=$(cat /tmp/resp.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('created',0))")
          if [ "$CREATED" -gt "0" ]; then
            echo "✓ $CREATED new leads imported"
          else
            echo "✓ No new leads (skipped: $(cat /tmp/resp.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('skipped',0))"))"
          fi
